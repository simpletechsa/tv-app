name: Build APK

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Signing key
        env:
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          if [ -n "$KEY_PASS" ]; then
            echo "SIGN_STORE=$GITHUB_WORKSPACE/signing/tvapp.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::KEY_PASS secret not set - using a temporary debug key"
          fi

      - name: Build
        env:
          SIGN_PASS: ${{ secrets.KEY_PASS }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Name file with version
        if: github.ref == 'refs/heads/main'
        run: |
          V=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "APK=STSA-TV-v$V" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/release/app-release.apk "STSA-TV-v$V.apk"

      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK }}
          path: ${{ env.APK }}.apk
          retention-days: 14
