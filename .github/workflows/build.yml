name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Signing key
        env:
          KEY_B64: ${{ secrets.KEY_B64 }}
        run: |
          if [ -n "$KEY_B64" ]; then
            echo "$KEY_B64" | base64 -d > "$RUNNER_TEMP/key.jks"
            echo "SIGN_STORE=$RUNNER_TEMP/key.jks" >> "$GITHUB_ENV"
          fi

      - name: Build
        env:
          SIGN_PASS: ${{ secrets.KEY_PASS }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - run: cp app/build/outputs/apk/release/app-release.apk MyTV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MyTV-apk
          path: MyTV.apk
          retention-days: 3
